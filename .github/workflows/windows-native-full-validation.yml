name: Windows native repaired full unit validation

on:
  push:
    branches:
      - validation/windows-native-fixed-unit-suite

permissions:
  contents: read

jobs:
  unit:
    name: ${{ matrix.scenario }} Windows unit ${{ matrix.shard }}/8
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scenario: [baseline, features]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      ORCA_BACKGROUND_LAUNCH: '1'
      ORCA_PNPM_GLOBAL_VIRTUAL_STORE: '0'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.scenario == 'baseline' && 'a6c78e3de39793513a94508564673efb14c4782f' || github.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: node
          node-version: '24.22.1'
          cache-electron-package: 'true'

      - name: Install Electron package binary
        run: node config/scripts/electron-installation/platform-layout/install-electron-package-binary.mjs

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: config/.bun-version
          no-cache: true

      # Tests replace HOME; keep rustup and Cargo anchored to the disposable runner.
      - name: Prepare Windows Rust executables before isolated test homes
        shell: pwsh
        run: |
          $env:RUSTUP_HOME = Join-Path $env:USERPROFILE '.rustup'
          $env:CARGO_HOME = Join-Path $env:USERPROFILE '.cargo'
          $env:RUSTUP_TOOLCHAIN = 'stable'
          "RUSTUP_HOME=$env:RUSTUP_HOME" >> $env:GITHUB_ENV
          "CARGO_HOME=$env:CARGO_HOME" >> $env:GITHUB_ENV
          "RUSTUP_TOOLCHAIN=$env:RUSTUP_TOOLCHAIN" >> $env:GITHUB_ENV
          cargo --version
          if ($LASTEXITCODE -ne 0) { throw 'The runner Rust toolchain is unavailable' }
          node config/scripts/native-build/windows/build-windows-agent-hook.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node config/scripts/native-build/windows/build-windows-cli-launcher.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record source, inventory and native readiness
        shell: bash
        env:
          VALIDATION_SCENARIO: ${{ matrix.scenario }}
          VALIDATION_SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p ci-shards/native-validation
          node config/scripts/native-build/node-addons/ensure-native-runtime.mjs --check-only
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          import { UNIT_INCLUDE } from './config/scripts/ci/unit-selection/dependency-graph/ci-unit-files.mjs'
          const files = [...fs.globSync(UNIT_INCLUDE, { exclude: ['**/node_modules/**', '**/.git/**'] })].map(p => p.replaceAll('\\', '/')).sort()
          fs.writeFileSync('ci-shards/native-validation/runtime.json', JSON.stringify({ source: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(), node: process.versions.node, platform: process.platform, arch: process.arch, scenario: process.env.VALIDATION_SCENARIO, shard: Number(process.env.VALIDATION_SHARD), shardCount: 8, nativeBootstrap: 'passed', inventory: files }, null, 2))
          NODE
          pnpm --version > ci-shards/native-validation/pnpm-version.txt
          bun --version > ci-shards/native-validation/bun-version.txt

      - name: Run complete unit inventory shard
        shell: pwsh
        run: |
          pnpm test --maxWorkers=4 --shard=${{ matrix.shard }}/8 --reporter=default --reporter=json --outputFile.json=ci-shards/native-validation/unit-results.json --silent=passed-only 2>&1 | Tee-Object -FilePath ci-shards/native-validation/unit-output.log
          exit $LASTEXITCODE

      - name: Upload full unit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-unit-${{ matrix.scenario }}-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: ci-shards/native-validation/
          if-no-files-found: warn
          retention-days: 7
